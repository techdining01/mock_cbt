<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mock CBT Examination</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/images/favicon.png"
    >

    <link
        rel="stylesheet"
        href="css/app.css"
    >

    <script src="js/chart.umd.min.js"></script>

    <script
        defer
        src="js/alpine.min.js"
    ></script>

    <style>
        [x-cloak] {
            display: none !important;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        /*
         * The exam is deliberately NOT height constrained.
         * Questions can become as tall as necessary and the
         * browser/document scrolls normally.
         */
        .exam-document {
            min-height: 100vh;
        }

        @media print {
            body * {
                visibility: hidden !important;
            }

            #result-print-area,
            #result-print-area * {
                visibility: visible !important;
            }

            #result-print-area {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                background: white !important;
                padding: 20px !important;
            }

            .no-print {
                display: none !important;
            }

            .print-page-break {
                page-break-before: always;
            }
        }
    </style>
</head>

<body class="bg-gray-100">

<div
    x-data="examApp"
    x-init="init()"
    x-cloak
>

    <!-- =========================================================
         LOADING
         ========================================================= -->
    <template x-if="loading">
        <div class="min-h-screen flex items-center justify-center p-6">
            <div class="bg-white rounded-2xl shadow-lg p-8 text-center max-w-md w-full">
                <div class="mx-auto mb-5 h-10 w-10 rounded-full border-4 border-gray-200 border-t-blue-600 animate-spin"></div>

                <h2
                    class="text-xl font-semibold text-gray-900"
                    x-text="loadingMessage"
                ></h2>

                <p class="mt-2 text-sm text-gray-500">
                    Please wait...
                </p>
            </div>
        </div>
    </template>


    <!-- =========================================================
         ERROR
         ========================================================= -->
    <template x-if="error">
        <div class="fixed inset-0 z-[100] bg-black/40 flex items-center justify-center p-6">
            <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-7">

                <div class="flex items-start gap-4">
                    <div class="h-10 w-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center font-bold">
                        !
                    </div>

                    <div class="flex-1">
                        <h2 class="text-lg font-bold text-gray-900">
                            Something went wrong
                        </h2>

                        <p
                            class="mt-2 text-sm text-gray-600"
                            x-text="error"
                        ></p>
                    </div>
                </div>

                <button
                    type="button"
                    @click="clearError()"
                    class="mt-6 w-full rounded-xl bg-blue-600 text-white py-3 font-semibold hover:bg-blue-700"
                >
                    Continue
                </button>

            </div>
        </div>
    </template>


    <!-- =========================================================
         EXAM SETUP
         ========================================================= -->
    <template x-if="!loading && screen === 'selection'">
        <main class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">

            <div class="mb-8 flex items-center gap-4">

                <div class="h-14 w-14 shrink-0 rounded-2xl bg-white border border-gray-200 shadow-sm flex items-center justify-center overflow-hidden">
                    <img
                        src="images/alayande.png"
                        alt="Exam logo"
                        class="h-10 w-10 object-contain"
                    >
                </div>

                <div>
                    <p class="text-sm font-semibold text-blue-600">
                        MOCK CBT
                    </p>

                    <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">
                        Examination Setup
                    </h1>

                    <p class="mt-1 text-gray-500">
                        Select your examination year and subjects.
                    </p>
                </div>

            </div>


            <div class="grid lg:grid-cols-3 gap-6">

                <!-- EXAM DETAILS -->
                <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">

                    <h2 class="text-lg font-bold text-gray-900">
                        Examination Details
                    </h2>

                    <div class="mt-6 space-y-5">

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Student Name
                            </label>

                            <input
                                type="text"
                                x-model="studentName"
                                placeholder="Enter your name"
                                class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                            >
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Examination Year
                            </label>

                            <select
                                :value="selectedYear || ''"
                                @change="selectYear($event.target.value)"
                                class="w-full rounded-xl border border-gray-300 px-4 py-3 bg-white outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">
                                    Select year
                                </option>

                                <template
                                    x-for="year in years"
                                    :key="year"
                                >
                                    <option
                                        :value="year"
                                        x-text="year"
                                    ></option>
                                </template>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Duration
                            </label>

                            <div class="flex items-center gap-3">
                                <input
                                    type="number"
                                    min="1"
                                    x-model.number="durationMinutes"
                                    class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                                >

                                <span class="text-gray-500">
                                    minutes
                                </span>
                            </div>
                        </div>

                    </div>
                </section>


                <!-- SUBJECTS -->
                <section class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-200 p-6">

                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">

                        <div>
                            <h2 class="text-lg font-bold text-gray-900">
                                Subjects
                            </h2>

                            <p class="text-sm text-gray-500 mt-1">
                                <span x-text="selectedSubjectIds.length"></span>
                                selected
                            </p>
                        </div>

                        <div class="flex gap-2">
                            <button
                                type="button"
                                @click="selectAllSubjects()"
                                class="px-3 py-2 rounded-lg text-sm font-medium bg-gray-100 hover:bg-gray-200"
                            >
                                Select All
                            </button>

                            <button
                                type="button"
                                @click="clearSubjects()"
                                class="px-3 py-2 rounded-lg text-sm font-medium bg-gray-100 hover:bg-gray-200"
                            >
                                Clear
                            </button>
                        </div>

                    </div>


                    <div
                        x-show="subjectsLoading"
                        class="py-12 text-center text-gray-500"
                    >
                        Loading subjects...
                    </div>


                    <div
                        x-show="!subjectsLoading && selectedYear && subjects.length"
                        class="mt-6 grid sm:grid-cols-2 gap-3"
                    >

                        <template
                            x-for="subject in subjects"
                            :key="subject.id"
                        >

                            <button
                                type="button"
                                @click="toggleSubject(subject.id)"
                                class="text-left border rounded-xl p-4 transition"
                                :class="
                                    isSubjectSelected(subject.id)
                                        ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500'
                                        : 'border-gray-200 bg-white hover:border-gray-300'
                                "
                            >

                                <div class="flex items-start justify-between gap-3">

                                    <div>
                                        <h3
                                            class="font-semibold text-gray-900"
                                            x-text="subject.name"
                                        ></h3>

                                        <p class="text-sm text-gray-500 mt-1">
                                            <span x-text="subject.question_count"></span>
                                            questions
                                        </p>
                                    </div>

                                    <div
                                        class="h-5 w-5 rounded-full border flex items-center justify-center"
                                        :class="
                                            isSubjectSelected(subject.id)
                                                ? 'border-blue-600 bg-blue-600 text-white'
                                                : 'border-gray-300'
                                        "
                                    >
                                        <span
                                            x-show="isSubjectSelected(subject.id)"
                                            class="text-xs"
                                        >
                                            ✓
                                        </span>
                                    </div>

                                </div>

                            </button>

                        </template>

                    </div>


                    <div
                        x-show="!subjectsLoading && selectedYear && !subjects.length"
                        class="mt-8 p-6 rounded-xl bg-gray-50 text-center text-gray-500"
                    >
                        No subjects are available for this year.
                    </div>


                    <div
                        x-show="!selectedYear"
                        class="mt-8 p-6 rounded-xl bg-gray-50 text-center text-gray-500"
                    >
                        Select an examination year to see subjects.
                    </div>


                    <div class="mt-8 border-t pt-6">

                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

                            <div>
                                <p class="text-sm text-gray-500">
                                    Total Questions
                                </p>

                                <p
                                    class="text-2xl font-bold text-gray-900"
                                    x-text="selectedQuestionCount"
                                ></p>
                            </div>

                            <button
                                type="button"
                                @click="createExam()"
                                :disabled="creatingExam || !selectedSubjectIds.length"
                                class="px-6 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                <span x-show="!creatingExam">
                                    Start Examination
                                </span>

                                <span x-show="creatingExam">
                                    Creating...
                                </span>
                            </button>

                        </div>

                    </div>

                </section>

            </div>
        </main>
    </template>


    <!-- =========================================================
         EXAM SCREEN
         NORMAL DOCUMENT FLOW - NO HEIGHT TRAP
         ========================================================= -->
    <template x-if="!loading && screen === 'exam'">
        <main class="exam-document">

            <!-- HEADER -->
            <header class="sticky top-0 z-40 bg-white border-b shadow-sm">

                <div class="max-w-7xl mx-auto px-4 py-3">

                    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">

                        <div>
                            <p class="text-xs uppercase tracking-wide text-gray-500">
                                Examination
                            </p>

                            <h1
                                class="font-bold text-gray-900"
                                x-text="exam?.student_name || 'Student'"
                            ></h1>
                        </div>


                        <div class="flex items-center gap-3">

                            <div class="px-4 py-2 rounded-xl bg-gray-900 text-white text-center">

                                <p class="text-[10px] text-gray-400">
                                    TIME REMAINING
                                </p>

                                <div
                                    class="text-xl sm:text-2xl font-mono font-bold"
                                    x-text="formatTime(remainingSeconds)"
                                ></div>

                            </div>

                            <button
                                type="button"
                                @click="finishExam()"
                                :disabled="finishingExam || timeExpiredHandled"
                                class="px-4 sm:px-5 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 disabled:opacity-50 whitespace-nowrap"
                            >
                                Submit Examination
                            </button>

                        </div>

                    </div>

                </div>
            </header>


            <div class="max-w-7xl mx-auto p-4 sm:p-6">

                <!-- OVERALL PROGRESS -->
                <section class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 mb-5">

                    <div class="flex items-center justify-between gap-3">

                        <div>
                            <p class="text-sm font-semibold text-gray-900">
                                Overall Progress
                            </p>

                            <p class="text-xs text-gray-500 mt-1">
                                <span x-text="answeredCount"></span>
                                of
                                <span x-text="totalQuestionCount"></span>
                                answered
                            </p>
                        </div>

                        <p
                            class="text-sm font-bold text-blue-700"
                            x-text="overallProgressPercent + '%'"
                        ></p>

                    </div>

                    <div class="mt-3 h-2 rounded-full bg-gray-100 overflow-hidden">
                        <div
                            class="h-full bg-blue-600 transition-all"
                            :style="{ width: overallProgressPercent + '%' }"
                        ></div>
                    </div>

                </section>


                <!-- SUBJECT PROGRESS -->
                <section class="mb-5">

                    <div class="flex gap-3 overflow-x-auto pb-2">

                        <template
                            x-for="(subject, index) in exam.subjects"
                            :key="subject.id"
                        >

                            <button
                                type="button"
                                @click="selectSubject(index)"
                                class="shrink-0 w-52 rounded-xl border p-3 text-left bg-white transition"
                                :class="
                                    index === subjectIndex
                                        ? 'border-blue-500 ring-1 ring-blue-500'
                                        : 'border-gray-200 hover:border-gray-300'
                                "
                            >

                                <div class="flex items-center justify-between gap-2">

                                    <span
                                        class="font-semibold text-gray-900 truncate"
                                        x-text="subject.name"
                                    ></span>

                                    <span
                                        class="text-xs font-bold text-blue-700"
                                        x-text="subjectProgressText(subject)"
                                    ></span>

                                </div>

                                <div class="mt-2 h-2 rounded-full bg-gray-100 overflow-hidden">
                                    <div
                                        class="h-full bg-blue-600 transition-all"
                                        :style="{
                                            width: subjectProgressPercent(subject) + '%'
                                        }"
                                    ></div>
                                </div>

                                <p
                                    class="mt-1 text-[11px] text-gray-500"
                                    x-text="subjectProgressPercent(subject) + '% complete'"
                                ></p>

                            </button>

                        </template>

                    </div>

                </section>


                <!-- QUESTION + NAVIGATOR -->
                <div class="grid lg:grid-cols-[minmax(0,1fr)_280px] gap-6 items-start">

                    <!-- QUESTION -->
                    <section
                        id="exam-question-area"
                        class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 sm:p-7"
                    >

                        <div class="flex items-start justify-between gap-4 mb-6">

                            <div>
                                <p
                                    class="text-sm text-gray-500"
                                    x-text="currentSubject?.name || ''"
                                ></p>

                                <h2 class="text-xl font-bold text-gray-900 mt-1">
                                    Question
                                    <span x-text="displayQuestionNumber"></span>
                                </h2>
                            </div>

                            <div class="text-sm text-gray-500 whitespace-nowrap">
                                <span x-text="answeredCount"></span>
                                /
                                <span x-text="totalQuestionCount"></span>
                            </div>

                        </div>


                        <div
                            class="text-lg leading-8 text-gray-900 whitespace-pre-line break-words"
                            x-text="currentQuestion?.text || ''"
                        ></div>


                        <!-- OPTIONS -->
                        <div class="mt-8 space-y-3">

                            <template
                                x-for="option in (currentQuestion?.options || [])"
                                :key="option.id"
                            >

                                <button
                                    type="button"
                                    @click="selectAnswer(option.id)"
                                    class="w-full text-left rounded-xl border p-4 transition"
                                    :class="
                                        Number(currentQuestion?.selected_option_id) === Number(option.id)
                                            ? 'border-blue-600 bg-blue-50 ring-1 ring-blue-600'
                                            : 'border-gray-200 hover:border-gray-400'
                                    "
                                >

                                    <div class="flex items-start gap-3">

                                        <span
                                            class="h-8 w-8 shrink-0 rounded-lg border flex items-center justify-center font-semibold"
                                            :class="
                                                Number(currentQuestion?.selected_option_id) === Number(option.id)
                                                    ? 'bg-blue-600 text-white border-blue-600'
                                                    : 'bg-gray-50 text-gray-700'
                                            "
                                            x-text="option.label"
                                        ></span>

                                        <span
                                            class="pt-1 text-gray-800 break-words"
                                            x-text="option.text"
                                        ></span>

                                    </div>

                                </button>

                            </template>

                        </div>


                        <!-- NAVIGATION -->
                        <div class="mt-10 flex items-center justify-between gap-3">

                            <button
                                type="button"
                                @click="previousQuestion()"
                                :disabled="!canGoPrevious"
                                class="px-5 py-3 rounded-xl border border-gray-300 bg-white font-semibold text-gray-700 disabled:opacity-40"
                            >
                                Previous
                            </button>

                            <button
                                type="button"
                                @click="nextQuestion()"
                                class="px-5 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700"
                            >
                                Next
                            </button>

                        </div>

                    </section>


                    <!-- QUESTION NAVIGATOR -->
                    <aside class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 lg:sticky lg:top-28">

                        <div class="flex items-center justify-between">

                            <div>
                                <h3 class="font-bold text-gray-900">
                                    Questions
                                </h3>

                                <p class="text-sm text-gray-500 mt-1">
                                    Select a question
                                </p>
                            </div>

                            <span class="text-sm font-bold text-blue-700">
                                <span x-text="subjectProgressText(currentSubject)"></span>
                            </span>

                        </div>


                        <div class="grid grid-cols-5 gap-2 mt-5">

                            <template
                                x-for="(question, index) in (currentSubject?.questions || [])"
                                :key="question.id"
                            >

                                <button
                                    type="button"
                                    @click="selectQuestion(index)"
                                    class="aspect-square rounded-lg text-sm font-semibold border"
                                    :class="
                                        index === questionIndex
                                            ? 'bg-blue-600 text-white border-blue-600'
                                            : question.selected_option_id !== null &&
                                              question.selected_option_id !== undefined
                                                ? 'bg-green-50 text-green-700 border-green-300'
                                                : 'bg-gray-50 text-gray-700 border-gray-200'
                                    "
                                    x-text="index + 1"
                                ></button>

                            </template>

                        </div>


                        <div class="mt-6 space-y-2 text-xs">

                            <div class="flex items-center gap-2">
                                <span class="h-3 w-3 rounded bg-blue-600"></span>
                                Current
                            </div>

                            <div class="flex items-center gap-2">
                                <span class="h-3 w-3 rounded bg-green-100 border border-green-300"></span>
                                Answered
                            </div>

                            <div class="flex items-center gap-2">
                                <span class="h-3 w-3 rounded bg-gray-100 border border-gray-300"></span>
                                Unanswered
                            </div>

                        </div>

                    </aside>

                </div>

            </div>

        </main>
    </template>


    <!-- =========================================================
         SUBMIT MODAL
         ========================================================= -->
    <template x-if="showFinishModal">

        <div class="fixed inset-0 z-[80] bg-black/50 flex items-center justify-center p-5">

            <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-7">

                <h2 class="text-xl font-bold text-gray-900">
                    Submit Examination?
                </h2>

                <p class="mt-3 text-gray-600">
                    Your answers will be submitted and your result will be calculated.
                </p>

                <div class="mt-4 grid grid-cols-3 gap-2 text-center text-sm">

                    <div class="rounded-lg bg-gray-50 p-3">
                        <div class="font-bold" x-text="totalQuestionCount"></div>
                        <div class="text-gray-500">Total</div>
                    </div>

                    <div class="rounded-lg bg-green-50 p-3">
                        <div class="font-bold text-green-700" x-text="answeredCount"></div>
                        <div class="text-green-600">Answered</div>
                    </div>

                    <div class="rounded-lg bg-amber-50 p-3">
                        <div class="font-bold text-amber-700" x-text="unansweredCount"></div>
                        <div class="text-amber-600">Unanswered</div>
                    </div>

                </div>

                <div class="mt-6 flex gap-3">

                    <button
                        type="button"
                        @click="showFinishModal = false"
                        class="flex-1 px-4 py-3 rounded-xl border border-gray-300 font-semibold"
                    >
                        Continue Exam
                    </button>

                    <button
                        type="button"
                        @click="confirmFinishExam()"
                        :disabled="finishingExam"
                        class="flex-1 px-4 py-3 rounded-xl bg-blue-600 text-white font-semibold disabled:opacity-50"
                    >
                        <span x-show="!finishingExam">
                            Submit
                        </span>

                        <span x-show="finishingExam">
                            Submitting...
                        </span>
                    </button>

                </div>

            </div>

        </div>

    </template>


    <!-- =========================================================
         TIMEOUT
         ========================================================= -->
    <template x-if="showTimeoutOverlay">

        <div class="fixed inset-0 z-[90] bg-black/60 flex items-center justify-center p-5">

            <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden">

                <div class="bg-blue-600 text-white p-8 text-center">

                    <div class="mx-auto h-16 w-16 rounded-full bg-white/20 flex items-center justify-center text-3xl">
                        ⏱
                    </div>

                    <h2 class="text-3xl font-bold mt-5">
                        Time's Up
                    </h2>

                    <p class="mt-2 text-blue-100">
                        Your examination time has ended.
                    </p>

                </div>


                <div class="p-7 text-center">

                    <p class="text-gray-600">

                        <template x-if="timeoutCompleting">
                            <span>
                                Your answers are being submitted. Please wait...
                            </span>
                        </template>

                        <template x-if="!timeoutCompleting && timeoutComplete">
                            <span>
                                Your answers have been submitted and your result is ready.
                            </span>
                        </template>

                    </p>


                    <div class="mt-7 grid sm:grid-cols-2 gap-3">

                        <button
                            type="button"
                            @click="viewTimeoutResult()"
                            :disabled="timeoutCompleting || !result"
                            class="w-full px-5 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <span x-show="!timeoutCompleting">
                                View Result
                            </span>

                            <span x-show="timeoutCompleting">
                                Submitting...
                            </span>
                        </button>


                        <button
                            type="button"
                            @click="restartApplication()"
                            class="w-full px-5 py-3 rounded-xl border border-gray-300 bg-white text-gray-800 font-semibold hover:bg-gray-50"
                        >
                            Restart Program
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </template>


    <!-- =========================================================
         RESULT
         ========================================================= -->
    <template x-if="screen === 'result' && result">

        <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

            <div id="result-print-area">

                <!-- RESULT HEADER -->
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 sm:p-8">

                    <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-5">

                        <div>
                            <p class="text-sm font-semibold text-blue-600">
                                EXAMINATION RESULT
                            </p>

                            <h1 class="text-3xl font-bold text-gray-900 mt-1">
                                <span x-text="result.student_name || 'Student'"></span>
                            </h1>

                            <p class="text-gray-500 mt-2">
                                Year:
                                <span
                                    class="font-medium"
                                    x-text="result.year"
                                ></span>
                            </p>
                        </div>

                        <div class="text-left sm:text-right">
                            <p class="text-sm text-gray-500">
                                Overall Score
                            </p>

                            <p class="text-5xl font-bold text-blue-600">
                                <span
                                    x-text="formatPercentage(result.percentage)"
                                ></span>
                            </p>
                        </div>

                    </div>


                    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mt-8">

                        <div class="rounded-xl bg-gray-50 p-4">
                            <p class="text-sm text-gray-500">Total</p>
                            <p
                                class="text-2xl font-bold text-gray-900 mt-1"
                                x-text="result.total"
                            ></p>
                        </div>

                        <div class="rounded-xl bg-green-50 p-4">
                            <p class="text-sm text-green-700">Correct</p>
                            <p
                                class="text-2xl font-bold text-green-800 mt-1"
                                x-text="result.correct"
                            ></p>
                        </div>

                        <div class="rounded-xl bg-red-50 p-4">
                            <p class="text-sm text-red-700">Wrong</p>
                            <p
                                class="text-2xl font-bold text-red-800 mt-1"
                                x-text="result.wrong"
                            ></p>
                        </div>

                        <div class="rounded-xl bg-amber-50 p-4">
                            <p class="text-sm text-amber-700">Unanswered</p>
                            <p
                                class="text-2xl font-bold text-amber-800 mt-1"
                                x-text="result.unanswered"
                            ></p>
                        </div>

                        <div class="rounded-xl bg-blue-50 p-4">
                            <p class="text-sm text-blue-700">Percentage</p>
                            <p
                                class="text-2xl font-bold text-blue-800 mt-1"
                                x-text="formatPercentage(result.percentage)"
                            ></p>
                        </div>

                    </div>

                </div>


                <!-- SUBJECT PERFORMANCE -->
                <section class="mt-6 bg-white rounded-2xl border border-gray-200 shadow-sm p-6">

                    <h2 class="text-xl font-bold text-gray-900">
                        Subject Performance
                    </h2>

                    <div class="mt-6 grid lg:grid-cols-2 gap-8">

                        <div class="relative h-[320px]">
                            <canvas id="resultSubjectChart"></canvas>
                        </div>


                        <div class="overflow-x-auto">

                            <table class="w-full text-sm">

                                <thead>
                                    <tr class="border-b">
                                        <th class="text-left py-3 pr-3">Subject</th>
                                        <th class="text-center px-3">Total</th>
                                        <th class="text-center px-3">Correct</th>
                                        <th class="text-center px-3">Wrong</th>
                                        <th class="text-right pl-3">%</th>
                                    </tr>
                                </thead>

                                <tbody>

                                    <template
                                        x-for="subject in resultSubjects"
                                        :key="subject.subject_id"
                                    >

                                        <tr class="border-b last:border-0">

                                            <td
                                                class="py-3 pr-3 font-medium text-gray-900"
                                                x-text="subject.subject_name"
                                            ></td>

                                            <td
                                                class="text-center px-3"
                                                x-text="subject.total"
                                            ></td>

                                            <td
                                                class="text-center px-3 text-green-700 font-semibold"
                                                x-text="subject.correct"
                                            ></td>

                                            <td
                                                class="text-center px-3 text-red-700 font-semibold"
                                                x-text="subject.wrong"
                                            ></td>

                                            <td
                                                class="text-right pl-3 font-semibold"
                                                x-text="formatPercentage(subject.percentage)"
                                            ></td>

                                        </tr>

                                    </template>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </section>


                <!-- QUESTION REVIEW -->
                <section class="mt-6">

                    <div class="mb-5">
                        <h2 class="text-2xl font-bold text-gray-900">
                            Question Review
                        </h2>

                        <p class="text-gray-500 mt-1">
                            Review your answers, the correct answers and explanations.
                        </p>
                    </div>


                    <div class="space-y-5">

                        <template
                            x-for="(question, reviewIndex) in resultReview"
                            :key="question.exam_question_id"
                        >

                            <article
                                class="rounded-2xl border overflow-hidden"
                                :class="reviewCardClass(question)"
                            >

                                <div
                                    class="px-5 py-4 border-b flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"
                                    :class="reviewHeaderClass(question)"
                                >

                                    <div>
                                        <p class="text-sm font-semibold">
                                            <span x-text="question.subject_name"></span>
                                            · Question
                                            <span x-text="question.number"></span>
                                        </p>
                                    </div>

                                    <span
                                        class="inline-flex px-3 py-1 rounded-full text-xs font-bold"
                                        :class="reviewStatusClass(question)"
                                        x-text="reviewStatusText(question)"
                                    ></span>

                                </div>


                                <div class="bg-white px-5 py-6">

                                    <p class="text-gray-900 font-medium leading-7">
                                        <span x-text="question.text"></span>
                                    </p>


                                    <div class="mt-5 space-y-2">

                                        <template
                                            x-for="option in question.options"
                                            :key="option.id"
                                        >

                                            <div
                                                class="rounded-xl border p-3"
                                                :class="reviewOptionClass(question, option)"
                                            >

                                                <div class="flex items-start gap-3">

                                                    <span
                                                        class="h-7 w-7 shrink-0 rounded-lg border flex items-center justify-center text-xs font-bold"
                                                        x-text="option.label"
                                                    ></span>

                                                    <div class="flex-1">

                                                        <p
                                                            class="text-sm"
                                                            x-text="option.text"
                                                        ></p>


                                                        <!-- CORRECT OPTION ONLY -->
                                                        <template
                                                            x-if="
                                                                question.correct_option_id !== null &&
                                                                question.correct_option_id !== undefined &&
                                                                Number(option.id) === Number(question.correct_option_id)
                                                            "
                                                        >
                                                            <p class="mt-1 text-xs font-bold text-green-700">
                                                                Correct answer
                                                            </p>
                                                        </template>


                                                        <!-- WRONG STUDENT SELECTION ONLY -->
                                                        <template
                                                            x-if="
                                                                question.selected_option_id !== null &&
                                                                question.selected_option_id !== undefined &&
                                                                Number(option.id) === Number(question.selected_option_id) &&
                                                                Number(option.id) !== Number(question.correct_option_id)
                                                            "
                                                        >
                                                            <p class="mt-1 text-xs font-bold text-red-700">
                                                                Your answer
                                                            </p>
                                                        </template>


                                                        <!-- STUDENT CORRECT SELECTION -->
                                                        <template
                                                            x-if="
                                                                question.selected_option_id !== null &&
                                                                question.selected_option_id !== undefined &&
                                                                question.correct_option_id !== null &&
                                                                question.correct_option_id !== undefined &&
                                                                Number(option.id) === Number(question.selected_option_id) &&
                                                                Number(option.id) === Number(question.correct_option_id)
                                                            "
                                                        >
                                                            <p class="mt-1 text-xs font-bold text-green-700">
                                                                Your answer · Correct
                                                            </p>
                                                        </template>

                                                    </div>

                                                </div>

                                            </div>

                                        </template>

                                    </div>


                                    <div class="mt-6 grid md:grid-cols-2 gap-4">

                                        <div class="rounded-xl bg-gray-50 border border-gray-200 p-4">

                                            <p class="text-xs uppercase tracking-wide text-gray-500 font-semibold">
                                                Your Answer
                                            </p>

                                            <p
                                                class="mt-2 text-sm text-gray-800"
                                                x-text="studentAnswerText(question)"
                                            ></p>

                                        </div>


                                        <div class="rounded-xl bg-green-50 border border-green-200 p-4">

                                            <p class="text-xs uppercase tracking-wide text-green-700 font-semibold">
                                                Correct Answer
                                            </p>

                                            <p
                                                class="mt-2 text-sm text-green-900"
                                                x-text="correctAnswerText(question)"
                                            ></p>

                                        </div>

                                    </div>


                                    <template x-if="question.explanation">

                                        <div class="mt-5 rounded-xl bg-blue-50 border border-blue-200 p-5">

                                            <p class="text-sm font-bold text-blue-800">
                                                Explanation
                                            </p>

                                            <p
                                                class="mt-2 text-sm leading-6 text-blue-950 whitespace-pre-line"
                                                x-text="question.explanation"
                                            ></p>

                                        </div>

                                    </template>


                                    <template x-if="!question.explanation">

                                        <div class="mt-5 rounded-xl bg-gray-50 border border-gray-200 p-5">

                                            <p class="text-sm font-bold text-gray-700">
                                                Explanation
                                            </p>

                                            <p class="mt-2 text-sm text-gray-500">
                                                No explanation is available for this question yet.
                                            </p>

                                        </div>

                                    </template>

                                </div>

                            </article>

                        </template>

                    </div>

                </section>

            </div>


            <!-- ACTIONS -->
            <div class="no-print mt-8 flex flex-col sm:flex-row gap-3">

                <button
                    type="button"
                    @click="printResult()"
                    class="flex-1 px-5 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700"
                >
                    Print Result
                </button>

                <button
                    type="button"
                    @click="restartApplication()"
                    class="flex-1 px-5 py-3 rounded-xl border border-gray-300 bg-white text-gray-800 font-semibold hover:bg-gray-50"
                >
                    Restart Program
                </button>

            </div>

        </main>

    </template>

</div>


<!-- =========================================================
     QWEBCHANNEL
     ========================================================= -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script>
    new QWebChannel(
        qt.webChannelTransport,
        function (channel) {
            console.log("QWebChannel connected.");

            window.examBridge =
                channel.objects.examBridge;

            console.log(
                "examBridge:",
                window.examBridge
            );
        }
    );
</script>


<!-- =========================================================
     APP JS
     ========================================================= -->
<script src="js/app.js"></script>

</body>
</html>
