<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mock CBT</title>


    <!-- =========================================================
         FAVICON
         ========================================================= -->

    <link
        rel="icon"
        type="image/png"
        href="assets/images/favicon.png"
    >


    <!-- =========================================================
         APPLICATION CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="css/app.css"
    >

</head>


<body class="bg-gray-100 text-gray-900">


<div
    x-data="examApp"
    class="min-h-screen flex flex-col"
>


    <!-- =========================================================
         GLOBAL LOADING
         ========================================================= -->

    <template x-if="loading">

        <main
            class="flex-1 flex items-center justify-center p-4 sm:p-6"
        >

            <div
                class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 sm:p-8 text-center w-full max-w-md"
            >

                <div
                    class="mx-auto mb-5 h-10 w-10 rounded-full border-4 border-gray-200 border-t-blue-600 animate-spin"
                ></div>

                <h1
                    class="text-xl font-semibold"
                    x-text="loadingMessage"
                ></h1>

                <p class="mt-2 text-sm text-gray-500">
                    Please wait...
                </p>

            </div>

        </main>

    </template>


    <!-- =========================================================
         GLOBAL ERROR
         ========================================================= -->

    <template x-if="!loading && error">

        <main
            class="flex-1 flex items-center justify-center p-4 sm:p-6"
        >

            <div
                class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 sm:p-8 text-center w-full max-w-md"
            >

                <div
                    class="mx-auto mb-5 w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-xl font-bold"
                >
                    !
                </div>

                <h1 class="text-xl font-semibold">
                    Something went wrong
                </h1>

                <p
                    class="mt-3 text-gray-600"
                    x-text="error"
                ></p>

                <button
                    type="button"
                    @click="clearError()"
                    class="mt-5 px-5 py-2.5 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700"
                >
                    Try Again
                </button>

            </div>

        </main>

    </template>


    <!-- =========================================================
         SELECTION SCREEN
         ========================================================= -->

    <template x-if="!loading && !error && screen === 'selection'">

        <div class="min-h-screen flex flex-col">


            <!-- HEADER -->

            <header class="bg-white border-b border-gray-200">

                <div class="max-w-6xl mx-auto px-4 sm:px-5 lg:px-6">

                    <div
                        class="min-h-14 sm:min-h-16 flex items-center justify-between gap-4"
                    >

                        <div class="flex items-center gap-3 sm:gap-4">
                            
                            <img
                                src="images/alayande.png"
                                alt="Mock CBT Logo"
                                class="h-8 sm:h-9"
                            >
                        

                            <div>

                                <h1 class="text-xl sm:text-2xl font-bold">
                                    Mock CBT
                                </h1>

                                <p class="text-xs sm:text-sm text-gray-500">
                                    Computer Based Examination
                                </p>

                            </div>

                            

                        </div>

                        <div
                            class="hidden sm:block text-sm text-gray-500"
                        >
                            Examination Practice
                        </div>

                    </div>

                </div>

            </header>


            <!-- MAIN -->

            <main
                class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-5 lg:px-6 py-5 sm:py-6"
            >

                <div
                    class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-5"
                >


                    <!-- LEFT -->

                    <section class="lg:col-span-1">

                        <div
                            class="bg-white border border-gray-200 rounded-xl shadow-sm p-4 sm:p-5 lg:sticky lg:top-5"
                        >

                            <h2 class="text-lg font-semibold">
                                Start Examination
                            </h2>

                            <p
                                class="mt-1.5 text-sm text-gray-500 leading-relaxed"
                            >
                                Select the examination year first.
                                The subjects available for that year
                                will then be loaded from the question
                                database.
                            </p>


                            <!-- STUDENT NAME -->

                            <div class="mt-5">

                                <label
                                    for="student-name"
                                    class="block text-sm font-medium text-gray-700 mb-1.5"
                                >
                                    Student Name
                                </label>

                                <input
                                    id="student-name"
                                    type="text"
                                    x-model.trim="studentName"
                                    placeholder="Enter your name"
                                    class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
                                >

                            </div>


                            <!-- DURATION -->

                            <div class="mt-4">

                                <label
                                    for="duration"
                                    class="block text-sm font-medium text-gray-700 mb-1.5"
                                >
                                    Examination Duration
                                </label>

                                <div class="relative">

                                    <input
                                        id="duration"
                                        type="number"
                                        min="1"
                                        x-model.number="durationMinutes"
                                        class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 pr-20 text-sm outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
                                    >

                                    <span
                                        class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-gray-500"
                                    >
                                        Minutes
                                    </span>

                                </div>

                            </div>


                            <!-- DATABASE INFO -->

                            <div
                                class="mt-5 rounded-lg bg-blue-50 border border-blue-100 p-3.5"
                            >

                                <p class="text-sm font-medium text-blue-900">
                                    Question Bank
                                </p>

                                <p
                                    class="mt-1 text-xs sm:text-sm text-blue-700 leading-relaxed"
                                >
                                    Questions are loaded from the
                                    examination records already stored
                                    in the local database.
                                </p>

                            </div>

                        </div>

                    </section>


                    <!-- RIGHT -->

                    <section class="lg:col-span-2">

                        <div
                            class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden"
                        >


                            <!-- YEAR -->

                            <div
                                class="px-4 py-4 sm:px-5 sm:py-5 border-b border-gray-200"
                            >

                                <h2 class="text-base sm:text-lg font-semibold">
                                    1. Select Examination Year
                                </h2>

                                <p class="mt-1 text-xs sm:text-sm text-gray-500">
                                    Choose the year you want to practise.
                                </p>


                                <div
                                    class="mt-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2"
                                >

                                    <template
                                        x-for="year in years"
                                        :key="year"
                                    >

                                        <button
                                            type="button"
                                            @click="selectYear(year)"
                                            class="rounded-lg border px-3 py-2.5 text-sm font-semibold transition"
                                            :class="
                                                selectedYear === year
                                                    ? 'border-blue-600 bg-blue-600 text-white shadow-sm'
                                                    : 'border-gray-200 bg-gray-50 text-gray-700 hover:bg-gray-100'
                                            "
                                            x-text="year"
                                        ></button>

                                    </template>

                                </div>

                            </div>


                            <!-- SUBJECTS -->

                            <div
                                class="px-4 py-4 sm:px-5 sm:py-5 border-b border-gray-200"
                            >

                                <div
                                    class="flex items-center justify-between gap-3"
                                >

                                    <div>

                                        <h2 class="text-base sm:text-lg font-semibold">
                                            2. Select Subjects
                                        </h2>

                                        <p
                                            class="mt-1 text-xs sm:text-sm text-gray-500"
                                            x-show="!selectedYear"
                                        >
                                            Select a year first.
                                        </p>

                                    </div>

                                    <div
                                        x-show="selectedYear && subjects.length > 0"
                                        class="flex gap-2"
                                    >

                                        <button
                                            type="button"
                                            @click="selectAllSubjects()"
                                            class="text-xs sm:text-sm font-medium text-blue-600"
                                        >
                                            Select All
                                        </button>

                                        <span class="text-gray-300">|</span>

                                        <button
                                            type="button"
                                            @click="clearSubjects()"
                                            class="text-xs sm:text-sm font-medium text-gray-600"
                                        >
                                            Clear
                                        </button>

                                    </div>

                                </div>


                                <!-- LOADING -->

                                <template x-if="subjectsLoading">

                                    <div
                                        class="mt-4 flex items-center gap-3 rounded-lg bg-gray-50 border border-gray-200 p-3.5"
                                    >

                                        <div
                                            class="h-5 w-5 rounded-full border-2 border-gray-300 border-t-blue-600 animate-spin"
                                        ></div>

                                        <span class="text-sm text-gray-600">
                                            Loading subjects for
                                            <span
                                                class="font-semibold"
                                                x-text="selectedYear"
                                            ></span>
                                            ...
                                        </span>

                                    </div>

                                </template>


                                <!-- SUBJECT CARDS -->

                                <div
                                    x-show="!subjectsLoading && selectedYear && subjects.length > 0"
                                    class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2.5"
                                >

                                    <template
                                        x-for="subject in subjects"
                                        :key="subject.id"
                                    >

                                        <button
                                            type="button"
                                            @click="toggleSubject(subject.id)"
                                            class="w-full text-left rounded-lg border p-3 transition"
                                            :class="
                                                isSubjectSelected(subject.id)
                                                    ? 'border-blue-600 bg-blue-50 ring-1 ring-blue-600'
                                                    : 'border-gray-200 bg-white hover:bg-gray-50'
                                            "
                                        >

                                            <div class="flex items-start justify-between">

                                                <div>

                                                    <h3
                                                        class="text-sm font-semibold"
                                                        x-text="subject.name"
                                                    ></h3>

                                                    <p class="mt-1 text-xs text-gray-500">

                                                        <span
                                                            x-text="subject.question_count ?? subject.count ?? 0"
                                                        ></span>

                                                        questions

                                                    </p>

                                                </div>

                                                <span
                                                    class="w-5 h-5 rounded-md border flex items-center justify-center"
                                                    :class="
                                                        isSubjectSelected(subject.id)
                                                            ? 'bg-blue-600 border-blue-600 text-white'
                                                            : 'bg-white border-gray-300 text-transparent'
                                                    "
                                                >
                                                    ✓
                                                </span>

                                            </div>

                                        </button>

                                    </template>

                                </div>

                            </div>


                            <!-- SUMMARY -->

                            <div class="px-4 py-4 sm:px-5 sm:py-5">

                                <div
                                    class="rounded-lg bg-gray-50 border border-gray-200 p-4"
                                >

                                    <h2 class="font-semibold">
                                        Examination Summary
                                    </h2>

                                    <div
                                        class="mt-3 grid grid-cols-3 gap-2.5"
                                    >

                                        <div class="bg-white border rounded-lg p-3">
                                            <p class="text-xs text-gray-500">
                                                Year
                                            </p>
                                            <p
                                                class="mt-1 text-lg font-bold"
                                                x-text="selectedYear || '—'"
                                            ></p>
                                        </div>

                                        <div class="bg-white border rounded-lg p-3">
                                            <p class="text-xs text-gray-500">
                                                Subjects
                                            </p>
                                            <p
                                                class="mt-1 text-lg font-bold"
                                                x-text="selectedSubjectIds.length"
                                            ></p>
                                        </div>

                                        <div class="bg-white border rounded-lg p-3">
                                            <p class="text-xs text-gray-500">
                                                Questions
                                            </p>
                                            <p
                                                class="mt-1 text-lg font-bold"
                                                x-text="selectedQuestionCount"
                                            ></p>
                                        </div>

                                    </div>


                                    <!-- SELECTED -->

                                    <template x-if="selectedSubjects.length > 0">

                                        <div class="mt-3 flex flex-wrap gap-1.5">

                                            <template
                                                x-for="subject in selectedSubjects"
                                                :key="subject.id"
                                            >

                                                <span
                                                    class="px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 text-xs font-medium"
                                                    x-text="subject.name"
                                                ></span>

                                            </template>

                                        </div>

                                    </template>


                                    <button
                                        type="button"
                                        @click="createExam()"
                                        :disabled="
                                            !selectedYear ||
                                            selectedSubjectIds.length === 0 ||
                                            creatingExam
                                        "
                                        class="mt-4 w-full rounded-lg bg-blue-600 px-5 py-3 text-white font-semibold hover:bg-blue-700 disabled:opacity-50"
                                    >

                                        <span x-show="!creatingExam">
                                            Start Examination
                                        </span>

                                        <span
                                            x-show="creatingExam"
                                            class="inline-flex items-center gap-2"
                                        >

                                            <span
                                                class="h-5 w-5 rounded-full border-2 border-white/40 border-t-white animate-spin"
                                            ></span>

                                            Creating Examination...

                                        </span>

                                    </button>

                                </div>

                            </div>

                        </div>

                    </section>

                </div>

            </main>

        </div>

    </template>


    <!-- =========================================================
         EXAM SCREEN
         ========================================================= -->

    <template x-if="!loading && !error && screen === 'exam' && exam">

        <div class="min-h-screen flex flex-col">


            <!-- HEADER -->

            <header
                class="bg-white border-b border-gray-200 sticky top-0 z-40"
            >

                <div class="max-w-6xl mx-auto px-4 sm:px-5 lg:px-6">

                    <div
                        class="min-h-14 sm:min-h-16 flex items-center justify-between gap-4"
                    >

                        <div class="min-w-0">

                            <h1 class="text-base sm:text-lg font-bold truncate">
                                Mock CBT Examination
                            </h1>

                            <p class="text-xs sm:text-sm text-gray-500">

                                Year:

                                <span
                                    class="font-semibold"
                                    x-text="exam.year"
                                ></span>

                                <template x-if="exam.student_name">

                                    <span>
                                        ·
                                        <span x-text="exam.student_name"></span>
                                    </span>

                                </template>

                            </p>

                        </div>


                        <!-- MASTER CLOCK -->

                        <div class="shrink-0 text-right">

                            <p class="text-[10px] uppercase tracking-wide text-gray-500">
                                Time Remaining
                            </p>

                            <div
                                class="text-lg sm:text-xl font-bold tabular-nums"
                                :class="
                                    remainingSeconds <= 300
                                        ? 'text-red-600'
                                        : 'text-gray-900'
                                "
                                x-text="formatTime(remainingSeconds)"
                            ></div>

                        </div>

                    </div>

                </div>

            </header>


            <!-- MAIN -->

            <main
                class="flex-1 w-full max-w-6xl mx-auto px-3 sm:px-4 lg:px-5 py-4 sm:py-5"
            >

                <div
                    class="grid grid-cols-1 lg:grid-cols-12 gap-4"
                >


                    <!-- QUESTION -->

                    <section
                        class="lg:col-span-9 flex flex-col gap-4"
                    >


                        <!-- SUBJECT NAV -->

                        <div
                            class="bg-white rounded-xl border border-gray-200 shadow-sm"
                        >

                            <div class="px-4 py-3 border-b">

                                <div class="flex justify-between">

                                    <h2 class="font-semibold">
                                        Subjects
                                    </h2>

                                    <div class="text-xs text-gray-500">

                                        <span x-text="answeredCount"></span>
                                        /
                                        <span x-text="totalQuestionCount"></span>
                                        answered

                                    </div>

                                </div>

                            </div>


                            <div class="px-3 py-2.5 overflow-x-auto">

                                <div class="flex gap-1.5 min-w-max">

                                    <template
                                        x-for="(subject, index) in exam.subjects"
                                        :key="subject.id"
                                    >

                                        <button
                                            type="button"
                                            @click="selectSubject(index)"
                                            class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium border"
                                            :class="
                                                subjectIndex === index
                                                    ? 'bg-blue-600 text-white border-blue-600'
                                                    : 'bg-gray-50 text-gray-700 border-gray-200'
                                            "
                                        >

                                            <span x-text="subject.name"></span>

                                            <span
                                                class="ml-1.5 text-[10px] opacity-80"
                                                x-text="subjectProgressText(subject)"
                                            ></span>

                                        </button>

                                    </template>

                                </div>

                            </div>

                        </div>


                        <!-- QUESTION CARD -->

                        <div
                            class="bg-white rounded-xl border border-gray-200 shadow-sm"
                        >

                            <div class="px-4 py-3.5 sm:px-5 border-b">

                                <div class="flex justify-between">

                                    <div>

                                        <p
                                            class="text-xs text-gray-500"
                                            x-text="currentSubject?.name"
                                        ></p>

                                        <h2 class="mt-0.5 text-base sm:text-lg font-semibold">

                                            Question
                                            <span x-text="displayQuestionNumber"></span>
                                            of
                                            <span x-text="currentSubject?.question_count"></span>

                                        </h2>

                                    </div>


                                    <div>

                                        <template x-if="currentQuestion?.answered">

                                            <span
                                                class="px-2.5 py-1 rounded-full bg-green-100 text-green-700 text-xs font-medium"
                                            >
                                                Answered
                                            </span>

                                        </template>

                                        <template x-if="!currentQuestion?.answered">

                                            <span
                                                class="px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 text-xs font-medium"
                                            >
                                                Not answered
                                            </span>

                                        </template>

                                    </div>

                                </div>

                            </div>


                            <div class="px-4 py-5 sm:px-6 sm:py-6">

                                <h3
                                    class="text-base sm:text-lg lg:text-xl font-medium leading-7 whitespace-pre-wrap"
                                    x-text="currentQuestion?.text"
                                ></h3>


                                <template x-if="currentQuestion?.image_path">

                                    <div class="mt-5">

                                        <img
                                            :src="currentQuestion.image_path"
                                            alt="Question illustration"
                                            class="max-w-full max-h-96 mx-auto rounded-lg border object-contain"
                                        >

                                    </div>

                                </template>


                                <!-- OPTIONS -->

                                <div class="mt-6 space-y-2.5">

                                    <template
                                        x-for="option in currentQuestion?.options || []"
                                        :key="option.id"
                                    >

                                        <button
                                            type="button"
                                            @click="selectAnswer(option.id)"
                                            class="w-full text-left border rounded-lg px-3.5 py-3 sm:px-4 sm:py-3.5"
                                            :class="
                                                currentQuestion?.selected_option_id === option.id
                                                    ? 'border-blue-600 bg-blue-50 ring-1 ring-blue-600'
                                                    : 'border-gray-200 bg-white hover:bg-gray-50'
                                            "
                                        >

                                            <div class="flex items-start gap-3">

                                                <span
                                                    class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold"
                                                    :class="
                                                        currentQuestion?.selected_option_id === option.id
                                                            ? 'bg-blue-600 text-white'
                                                            : 'bg-gray-100 text-gray-700'
                                                    "
                                                    x-text="option.label"
                                                ></span>

                                                <span
                                                    class="pt-1 text-sm sm:text-base whitespace-pre-wrap"
                                                    x-text="option.text"
                                                ></span>

                                            </div>

                                        </button>

                                    </template>

                                </div>

                            </div>


                            <!-- NAVIGATION -->

                            <div class="px-4 py-3.5 sm:px-5 border-t">

                                <div class="flex justify-between">

                                    <button
                                        type="button"
                                        @click="previousQuestion()"
                                        :disabled="!canGoPrevious"
                                        class="px-4 py-2 rounded-lg border border-gray-300 bg-white text-sm font-medium disabled:opacity-50"
                                    >
                                        Previous
                                    </button>


                                    <button
                                        type="button"
                                        @click="nextQuestion()"
                                        class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium"
                                    >
                                        Next
                                    </button>

                                </div>

                            </div>

                        </div>

                    </section>


                    <!-- SIDEBAR -->

                    <aside class="lg:col-span-3">

                        <div class="lg:sticky lg:top-20 space-y-3">


                            <!-- PROGRESS -->

                            <div
                                class="bg-white rounded-xl border border-gray-200 shadow-sm p-4"
                            >

                                <h2 class="text-sm font-semibold">
                                    Exam Progress
                                </h2>

                                <div class="grid grid-cols-3 gap-1.5 mt-3">

                                    <div class="bg-gray-50 rounded-lg p-2.5 text-center">

                                        <div
                                            class="text-base font-bold"
                                            x-text="totalQuestionCount"
                                        ></div>

                                        <div class="text-[10px] text-gray-500">
                                            Total
                                        </div>

                                    </div>


                                    <div class="bg-green-50 rounded-lg p-2.5 text-center">

                                        <div
                                            class="text-base font-bold text-green-700"
                                            x-text="answeredCount"
                                        ></div>

                                        <div class="text-[10px] text-green-700">
                                            Answered
                                        </div>

                                    </div>


                                    <div class="bg-gray-50 rounded-lg p-2.5 text-center">

                                        <div
                                            class="text-base font-bold"
                                            x-text="unansweredCount"
                                        ></div>

                                        <div class="text-[10px] text-gray-500">
                                            Remaining
                                        </div>

                                    </div>

                                </div>

                            </div>


                            <!-- NAVIGATOR -->

                            <div
                                class="bg-white rounded-xl border border-gray-200 shadow-sm p-4"
                            >

                                <h2 class="text-sm font-semibold">
                                    Questions
                                </h2>

                                <div
                                    class="mt-3 grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-5 gap-1.5"
                                >

                                    <template
                                        x-for="(question, index) in currentSubject?.questions || []"
                                        :key="question.id"
                                    >

                                        <button
                                            type="button"
                                            @click="selectQuestion(index)"
                                            class="aspect-square rounded-md text-xs font-medium"
                                            :class="[

                                                question.selected_option_id !== null &&
                                                question.selected_option_id !== undefined
                                                    ? 'bg-green-500 text-white'
                                                    : 'bg-gray-100 text-gray-700',

                                                questionIndex === index
                                                    ? 'ring-2 ring-blue-600 ring-offset-1'
                                                    : ''

                                            ]"
                                            x-text="index + 1"
                                        ></button>

                                    </template>

                                </div>

                            </div>


                            <!-- SUBJECT PROGRESS -->

                            <div
                                class="bg-white rounded-xl border border-gray-200 shadow-sm p-4"
                            >

                                <h2 class="text-sm font-semibold">
                                    Subject Progress
                                </h2>

                                <div class="mt-3 space-y-3">

                                    <template
                                        x-for="subject in exam.subjects"
                                        :key="subject.id"
                                    >

                                        <div>

                                            <div class="flex justify-between text-xs mb-1">

                                                <span
                                                    class="font-medium truncate"
                                                    x-text="subject.name"
                                                ></span>

                                                <span
                                                    class="text-gray-500"
                                                    x-text="subjectProgressText(subject)"
                                                ></span>

                                            </div>

                                            <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">

                                                <div
                                                    class="h-full bg-green-500"
                                                    :style="`
                                                        width: ${
                                                            subject.question_count
